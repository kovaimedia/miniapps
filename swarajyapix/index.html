<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwarajyaPix - Bulk Image Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --bg-elevated: rgba(255,255,255,0.04);
    --bg-glass: rgba(255,255,255,0.06);
    --bg-glass-hover: rgba(255,255,255,0.1);
    --border: rgba(255,255,255,0.08);
    --border-focus: rgba(249,115,22,0.5);
    --text: #e4e4e7;
    --text-muted: #71717a;
    --text-dim: #52525b;
    --accent: #f97316;
    --accent-hover: #ea580c;
    --accent-glow: rgba(249,115,22,0.15);
    --success: #22c55e;
    --error: #ef4444;
    --warning: #f59e0b;
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===== VIEW TRANSITIONS ===== */
  .view {
    display: none;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: translateY(8px);
  }
  .view.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  /* ===== LOGIN VIEW ===== */
  #loginView {
    min-height: 100vh;
    display: none;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(249,115,22,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(99,102,241,0.06) 0%, transparent 50%),
      var(--bg);
  }
  #loginView.active {
    display: flex;
    opacity: 1;
    transform: none;
  }

  .login-card {
    width: 100%;
    max-width: 400px;
    padding: 2.5rem;
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .login-brand {
    text-align: center;
    margin-bottom: 2rem;
  }

  .login-brand h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .login-brand h1 span { color: var(--accent); }

  .login-brand p {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.4rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-group label {
    display: block;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }

  .form-input {
    width: 100%;
    padding: 0.7rem 0.9rem;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .form-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .form-input::placeholder { color: var(--text-dim); }

  .login-error {
    display: none;
    padding: 0.6rem 0.8rem;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    border-radius: var(--radius-sm);
    color: var(--error);
    font-size: 0.8rem;
    margin-bottom: 1rem;
  }

  .login-error.visible { display: block; }

  .btn-login {
    width: 100%;
    padding: 0.75rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background var(--transition), opacity var(--transition);
  }

  .btn-login:hover { background: var(--accent-hover); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== APP VIEW ===== */
  #appView.active { display: block; opacity: 1; transform: none; }

  /* Top Bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.5rem;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .topbar-brand {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .topbar-brand span { color: var(--accent); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .topbar-user {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .batch-mode-link {
    padding: 0.35rem 0.8rem;
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 500;
    text-decoration: none;
    transition: all var(--transition);
  }

  .batch-mode-link:hover {
    color: var(--accent);
    border-color: rgba(249,115,22,0.3);
    background: var(--accent-glow);
  }

  .btn-logout {
    padding: 0.35rem 0.8rem;
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all var(--transition);
  }

  .btn-logout:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.2);
  }

  /* Container */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  /* Quick Generate */
  .quick-gen {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .quick-gen-input {
    flex: 1;
    padding: 0.7rem 0.9rem;
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .quick-gen-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .quick-gen-input::placeholder { color: var(--text-dim); }

  .quick-gen-btn {
    padding: 0.7rem 1.4rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--transition), opacity var(--transition);
  }

  .quick-gen-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .quick-gen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Controls Panel */
  .controls {
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .controls-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
  }

  .controls-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .controls-toggle {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    transition: color var(--transition);
  }

  .controls-toggle:hover { color: var(--text); }

  .controls-body {
    display: flex;
    gap: 1rem;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.3s ease;
  }

  .controls-body.collapsed {
    max-height: 0;
    opacity: 0;
    margin: 0;
    overflow: hidden;
  }

  .controls-left { flex: 1; }
  .controls-right {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    min-width: 200px;
  }

  textarea#jsonInput {
    width: 100%;
    height: 140px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 0.8rem;
    color: var(--text);
    resize: vertical;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  textarea#jsonInput:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  textarea#jsonInput::placeholder { color: var(--text-dim); }

  /* File Upload */
  .file-upload {
    position: relative;
    margin-top: 0.5rem;
  }

  .file-upload input[type="file"] {
    position: absolute;
    left: 0;
    top: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }

  .file-upload-btn {
    display: block;
    width: 100%;
    padding: 0.5rem;
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.12);
    border-radius: var(--radius-sm);
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all var(--transition);
  }

  .file-upload-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Aspect Ratio Pills */
  .aspect-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-bottom: 0.35rem;
    font-weight: 500;
  }

  .aspect-pills {
    display: flex;
    gap: 0;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  .aspect-pill, .res-pill {
    flex: 1;
    padding: 0.45rem 0.6rem;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }

  .aspect-pill.active, .res-pill.active {
    background: var(--accent);
    color: white;
  }

  .aspect-pill:hover:not(.active), .res-pill:hover:not(.active) {
    background: var(--bg-glass-hover);
  }

  /* Action Buttons */
  .btn {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
  }

  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-validate {
    background: var(--bg-glass-hover);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-validate:hover:not(:disabled) {
    background: rgba(255,255,255,0.15);
  }

  .btn-generate {
    background: var(--accent);
    color: white;
    width: 100%;
  }

  .btn-generate:hover:not(:disabled) { background: var(--accent-hover); }

  .btn-download {
    background: rgba(255,255,255,0.08);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-download:hover:not(:disabled) {
    background: rgba(255,255,255,0.14);
  }

  /* Validation Result */
  .validation-result {
    margin-top: 0.75rem;
    padding: 0.7rem 0.9rem;
    border-radius: var(--radius-sm);
    font-size: 0.8rem;
    display: none;
  }

  .validation-result.success {
    display: block;
    background: rgba(34,197,94,0.08);
    color: var(--success);
    border: 1px solid rgba(34,197,94,0.15);
  }

  .validation-result.error {
    display: block;
    background: rgba(239,68,68,0.08);
    color: var(--error);
    border: 1px solid rgba(239,68,68,0.15);
  }

  .prompt-preview {
    margin-top: 0.4rem;
    max-height: 100px;
    overflow-y: auto;
    font-size: 0.75rem;
  }

  .prompt-preview li {
    margin-left: 1.2rem;
    margin-bottom: 0.15rem;
    color: var(--text-muted);
  }

  /* Progress Bar */
  .progress-section {
    display: none;
    margin-bottom: 1rem;
  }

  .progress-section.visible { display: block; }

  .progress-track {
    height: 3px;
    background: var(--bg-glass);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    border-radius: 2px;
    transition: width 0.3s ease;
    width: 0%;
    animation: shimmer 2s infinite;
    background-size: 200% 100%;
  }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .progress-text {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 0.4rem;
  }

  /* Gallery */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
  }

  .card {
    background: var(--bg-glass);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(249,115,22,0.06);
    border-color: rgba(255,255,255,0.12);
  }

  .card-image {
    width: 100%;
    aspect-ratio: 3/2;
    background: rgba(0,0,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    position: relative;
  }

  .card-image.square { aspect-ratio: 1/1; }

  .card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }

  .card:hover .card-image img { transform: scale(1.03); }

  .card-body { padding: 0.75rem; }

  .card-prompt {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }

  .card-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }

  /* Status Badges */
  .status-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .badge-pending {
    background: rgba(113,113,122,0.15);
    color: var(--text-dim);
  }

  .badge-generating {
    background: rgba(245,158,11,0.12);
    color: var(--warning);
    animation: pulse 1.5s ease-in-out infinite;
  }

  .badge-done {
    background: rgba(34,197,94,0.12);
    color: var(--success);
  }

  .badge-error {
    background: rgba(239,68,68,0.12);
    color: var(--error);
  }

  .badge-unverified {
    background: rgba(245,158,11,0.12);
    color: var(--warning);
    cursor: help;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .retry-btn {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.2);
    color: var(--error);
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.65rem;
    cursor: pointer;
    margin-left: auto;
    transition: all var(--transition);
  }

  .retry-btn:hover {
    background: rgba(239,68,68,0.2);
  }

  /* Spinner */
  .spinner {
    width: 28px;
    height: 28px;
    border: 2px solid rgba(255,255,255,0.08);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Floating Actions Bar */
  .floating-bar {
    display: none;
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 0.65rem 1.25rem;
    z-index: 90;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .floating-bar.visible { display: flex; }

  .floating-bar .count {
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 2rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .lightbox.open {
    display: flex;
    opacity: 1;
  }

  .lightbox-close {
    position: absolute;
    top: 1rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 2rem;
    cursor: pointer;
    transition: color var(--transition);
    z-index: 1001;
  }

  .lightbox-close:hover { color: white; }

  .lightbox-img {
    max-width: 90vw;
    max-height: 72vh;
    border-radius: var(--radius);
    box-shadow: 0 16px 64px rgba(0,0,0,0.6);
  }

  .lightbox-prompt {
    color: var(--text-muted);
    margin-top: 1rem;
    text-align: center;
    max-width: 600px;
    font-size: 0.85rem;
    line-height: 1.6;
  }

  .lightbox-download {
    margin-top: 0.75rem;
    padding: 0.5rem 1.2rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    transition: background var(--transition);
  }

  .lightbox-download:hover { background: var(--accent-hover); }

  .lightbox-edit {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
    width: 100%;
    max-width: 600px;
  }

  .lightbox-edit-input {
    flex: 1;
    padding: 0.5rem 0.75rem;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }

  .lightbox-edit-input:focus {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .lightbox-edit-input::placeholder { color: var(--text-dim); }

  .lightbox-edit-btn {
    padding: 0.5rem 1rem;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
    transition: background var(--transition), opacity var(--transition);
  }

  .lightbox-edit-btn:hover:not(:disabled) { background: var(--accent-hover); }
  .lightbox-edit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .lightbox-edit-error {
    color: var(--error);
    font-size: 0.75rem;
    margin-top: 0.35rem;
    text-align: center;
    max-width: 600px;
    min-height: 1.1em;
  }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.8rem 0.6rem;
    border-radius: var(--radius-sm);
    opacity: 0.6;
    transition: opacity var(--transition), background var(--transition);
    z-index: 1001;
  }

  .lightbox-nav:hover { opacity: 1; background: rgba(255,255,255,0.12); }
  .lightbox-prev { left: 1rem; }
  .lightbox-next { right: 1rem; }

  /* Empty State */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
  }

  .empty-state svg {
    width: 56px;
    height: 56px;
    margin-bottom: 1rem;
    opacity: 0.2;
    stroke: var(--text-dim);
  }

  .empty-state p {
    font-size: 0.85rem;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .controls-body { flex-direction: column; }
    .controls-right { min-width: unset; }
    .gallery { grid-template-columns: 1fr; }
    .topbar { padding: 0.75rem 1rem; }
    .container { padding: 1rem; }
    .login-card { margin: 1rem; }
    .floating-bar {
      left: 1rem;
      right: 1rem;
      transform: none;
    }
  }

  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
</style>
</head>
<body>

<!-- ===== LOGIN VIEW ===== -->
<div class="view" id="loginView">
  <div class="login-card">
    <div class="login-brand">
      <h1>Swarajya<span>Pix</span></h1>
      <p>Bulk Image Generator</p>
    </div>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input class="form-input" id="loginUsername" type="text" placeholder="Enter username" required autofocus>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="Enter password" required>
      </div>

<!-- ===== APP VIEW ===== -->
<div class="view" id="appView">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">Swarajya<span>Pix</span></div>
    <div class="topbar-right">
      <a href="/batch" class="batch-mode-link">Batch Mode</a>
      <span class="topbar-user" id="displayUser"></span>
      <button class="btn-logout" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="container">
    <!-- Quick Generate -->
    <div class="quick-gen">
      <input class="quick-gen-input" id="quickGenInput" type="text" placeholder="Type a single prompt and hit Generate...">
      <button class="quick-gen-btn" id="quickGenBtn">Generate</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="controls-header">
        <div class="controls-title">Image Prompts</div>
        <button class="controls-toggle" id="controlsToggle">Collapse</button>
      </div>
      <div class="controls-body" id="controlsBody">
        <div class="controls-left">
          <textarea id="jsonInput" placeholder='Paste prompts here (JSON, free text, CSV, or article)...&#10;&#10;JSON: ["a red apple on white background", "a blue sky with clouds"]&#10;Free text: a cat on a roof, a sunset over mountains&#10;Article: paste any text and AI will extract visual prompts'></textarea>
          <div class="file-upload">
            <div class="file-upload-btn" id="fileLabel">Upload .json file</div>
            <input type="file" id="fileInput" accept=".json,application/json">
          </div>
        </div>
        <div class="controls-right">
          <div>
            <div class="aspect-label">Aspect Ratio</div>
            <div class="aspect-pills">
              <button class="aspect-pill active" data-ratio="3:2">3:2</button>
              <button class="aspect-pill" data-ratio="16:9">16:9</button>
              <button class="aspect-pill" data-ratio="4:3">4:3</button>
              <button class="aspect-pill" data-ratio="1:1">1:1</button>
              <button class="aspect-pill" data-ratio="9:16">9:16</button>
            </div>
          </div>
          <div>
            <div class="aspect-label">Resolution</div>
            <div class="aspect-pills">
              <button class="res-pill active" data-size="1K">1K</button>
              <button class="res-pill" data-size="2K">2K</button>
              <button class="res-pill" data-size="4K">4K</button>
            </div>
          </div>
          <button class="btn btn-validate" id="validateBtn">Validate</button>
          <button class="btn btn-generate" id="generateBtn" disabled>Generate All</button>
        </div>
      </div>
      <div class="validation-result" id="validationResult"></div>
    </div>

    <!-- Progress -->
    <div class="progress-section" id="progressBar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-text" id="progressText">Generating 0 / 0</div>
    </div>

    <!-- Gallery -->
    <div class="gallery" id="gallery">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="m21 15-5-5L5 21"/>
        </svg>
        <p>Paste your JSON prompts and click Generate</p>
      </div>
    </div>
  </div>

  <!-- Floating Actions Bar -->
  <div class="floating-bar" id="floatingBar">
    <span class="count" id="imageCount">0 images</span>
    <button class="btn btn-download" id="downloadAllBtn">Download ZIP</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-prompt" id="lightboxPrompt"></div>
  <div class="lightbox-edit">
    <input class="lightbox-edit-input" id="lightboxEditInput" type="text" placeholder="Edit: e.g. &quot;make sky more blue&quot;, &quot;remove text&quot;">
    <button class="lightbox-edit-btn" id="lightboxEditBtn">Submit</button>
  </div>
  <div class="lightbox-edit-error" id="lightboxEditError"></div>
  <button class="lightbox-download" id="lightboxDownload">Download Image</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function() {
  // ===== AUTH STATE =====
  let authToken = localStorage.getItem('swarajyapix_token');
  let currentUser = localStorage.getItem('swarajyapix_user');

  const loginView = document.getElementById('loginView');
  const appView = document.getElementById('appView');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const loginUsername = document.getElementById('loginUsername');
  const loginPassword = document.getElementById('loginPassword');
  const displayUser = document.getElementById('displayUser');
  const logoutBtn = document.getElementById('logoutBtn');

  function showLogin() {
    appView.classList.remove('active');
    loginView.classList.add('active');
    loginUsername.focus();
  }

  function showApp(username) {
    loginView.classList.remove('active');
    appView.classList.add('active');
    displayUser.textContent = username;
  }

  // Check existing token on load
  async function checkAuth() {
    if (!authToken) {
      showLogin();
      return;
    }
    try {
      const res = await fetch('/api/me', {
        headers: { 'Authorization': 'Bearer ' + authToken }
      });
      if (res.ok) {
        const data = await res.json();
        currentUser = data.username;
        localStorage.setItem('swarajyapix_user', currentUser);
        showApp(currentUser);
      } else {
        logout();
      }
    } catch {
      logout();
    }
  }

  function logout() {
    authToken = null;
    currentUser = null;
    localStorage.removeItem('swarajyapix_token');
    localStorage.removeItem('swarajyapix_user');
    showLogin();
  }

  logoutBtn.addEventListener('click', logout);

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = loginUsername.value.trim();
    const password = loginPassword.value;

    if (!username || !password) return;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Signing in...';
    loginError.classList.remove('visible');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (res.ok && data.token) {
        authToken = data.token;
        currentUser = data.username;
        localStorage.setItem('swarajyapix_token', authToken);
        localStorage.setItem('swarajyapix_user', currentUser);
        loginPassword.value = '';
        showApp(currentUser);
      } else {
        loginError.textContent = data.error || 'Login failed';
        loginError.classList.add('visible');
      }
    } catch (err) {
      loginError.textContent = 'Connection error';
      loginError.classList.add('visible');
    }

    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign in';
  });

  // ===== APP STATE =====
  let prompts = [];
  let results = [];
  let selectedRatio = '3:2';
  let selectedResolution = '1K';
  let currentLightboxIndex = -1;

  // Elements
  const jsonInput = document.getElementById('jsonInput');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const validateBtn = document.getElementById('validateBtn');
  const generateBtn = document.getElementById('generateBtn');
  const validationResult = document.getElementById('validationResult');
  const gallery = document.getElementById('gallery');
  const emptyState = document.getElementById('emptyState');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');
  const floatingBar = document.getElementById('floatingBar');
  const downloadAllBtn = document.getElementById('downloadAllBtn');
  const imageCount = document.getElementById('imageCount');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxPrompt = document.getElementById('lightboxPrompt');
  const lightboxClose = document.getElementById('lightboxClose');
  const lightboxDownload = document.getElementById('lightboxDownload');
  const lightboxPrev = document.getElementById('lightboxPrev');
  const lightboxNext = document.getElementById('lightboxNext');

  // Controls toggle
  const controlsToggle = document.getElementById('controlsToggle');
  const controlsBody = document.getElementById('controlsBody');
  controlsToggle.addEventListener('click', () => {
    controlsBody.classList.toggle('collapsed');
    controlsToggle.textContent = controlsBody.classList.contains('collapsed') ? 'Expand' : 'Collapse';
  });

  // Aspect ratio pills
  document.querySelectorAll('.aspect-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.aspect-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedRatio = btn.dataset.ratio;
    });
  });

  // Resolution pills
  document.querySelectorAll('.res-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.res-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedResolution = btn.dataset.size;
    });
  });

  // File upload
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    fileLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = (ev) => { jsonInput.value = ev.target.result; };
    reader.readAsText(file);
  });

  // Parse flexible JSON
  function parsePrompts(raw) {
    let data;
    try { data = JSON.parse(raw); }
    catch (e) { throw new Error('Invalid JSON: ' + e.message); }

    if (typeof data === 'string') return [data];

    if (Array.isArray(data)) {
      return data.map((item, i) => {
        if (typeof item === 'string') return item;
        if (typeof item === 'object' && item !== null) {
          const val = item.prompt || item.text || item.description;
          if (!val) throw new Error('Item ' + i + ': no prompt/text/description key');
          // Unwrap nested objects (e.g. {prompt: {prompt: "..."}})
          if (typeof val === 'object' && val !== null) {
            const inner = val.prompt || val.text || val.description;
            if (typeof inner === 'string') return inner;
          }
          if (typeof val === 'string') return val;
          throw new Error('Item ' + i + ': prompt value is not a string');
        }
        throw new Error('Item ' + i + ': expected string or object');
      });
    }

    if (typeof data === 'object' && data !== null) {
      const arrayKey = ['prompts', 'items', 'data', 'images'].find(k => Array.isArray(data[k]));
      if (arrayKey) return parsePrompts(JSON.stringify(data[arrayKey]));
      for (const key of Object.keys(data)) {
        if (Array.isArray(data[key])) return parsePrompts(JSON.stringify(data[key]));
      }
      throw new Error('Object has no array property');
    }

    throw new Error('Unexpected data type: ' + typeof data);
  }

  // Validate (with AI fallback)
  validateBtn.addEventListener('click', async () => {
    const raw = jsonInput.value.trim();
    if (!raw) { showValidation('error', 'Please enter or upload prompts'); return; }

    // Try client-side JSON parse first (instant, free)
    let parsed = null;
    let aiParsed = false;
    try {
      parsed = parsePrompts(raw);
    } catch (clientErr) {
      // Client-side parse failed -- fall back to AI
      validateBtn.disabled = true;
      validateBtn.textContent = 'AI is parsing...';
      showValidation('success', 'Client-side parse failed, asking AI to extract prompts...');

      try {
        const res = await fetch('/api/parse-prompts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken,
          },
          body: JSON.stringify({ text: raw }),
        });

        if (res.status === 401) { logout(); return; }

        const data = await res.json();
        if (data.error) {
          throw new Error(data.error);
        }
        parsed = data.prompts;
        aiParsed = true;
      } catch (aiErr) {
        showValidation('error', 'Could not parse input: ' + aiErr.message);
        generateBtn.disabled = true;
        prompts = [];
        validateBtn.disabled = false;
        validateBtn.textContent = 'Validate';
        return;
      }

      validateBtn.disabled = false;
      validateBtn.textContent = 'Validate';
    }

    if (!parsed || parsed.length === 0) {
      showValidation('error', 'No prompts found');
      generateBtn.disabled = true;
      prompts = [];
      return;
    }

    prompts = parsed;
    const label = aiParsed ? ' (AI-parsed)' : '';
    let html = '<strong>' + prompts.length + ' prompt' + (prompts.length > 1 ? 's' : '') + ' found' + label + ':</strong>';
    html += '<ol class="prompt-preview">';
    prompts.forEach(p => {
      const display = p.length > 100 ? p.slice(0, 100) + '...' : p;
      html += '<li>' + escapeHtml(display) + '</li>';
    });
    html += '</ol>';
    showValidation('success', html);
    generateBtn.disabled = false;
  });

  function showValidation(type, html) {
    validationResult.className = 'validation-result ' + type;
    validationResult.innerHTML = html;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // Generate
  generateBtn.addEventListener('click', startGeneration);

  async function startGeneration() {
    if (prompts.length === 0) return;
    generateBtn.disabled = true;
    validateBtn.disabled = true;

    results = prompts.map(p => ({ prompt: p, status: 'pending', image: null, mimeType: null, error: null }));
    renderGallery();
    showProgress();

    const STAGGER_MS = 2000;

    const generateOne = async (index) => {
      results[index].status = 'generating';
      updateCard(index);
      updateProgress();

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + authToken,
          },
          body: JSON.stringify({ prompt: results[index].prompt, aspectRatio: selectedRatio, imageSize: selectedResolution }),
        });

        if (res.status === 401) {
          logout();
          return;
        }

        const data = await res.json();
        if (res.status === 429) {
          results[index].status = 'error';
          results[index].error = data.error || 'Rate limit exceeded';
        } else if (data.error) {
          results[index].status = 'error';
          results[index].error = data.error;
        } else {
          results[index].status = 'done';
          results[index].image = data.image;
          results[index].mimeType = data.mimeType || 'image/png';
          results[index].verified = data.verified;
          results[index].problems = data.problems;
        }
      } catch (e) {
        results[index].status = 'error';
        results[index].error = e.message;
      }

      updateCard(index);
      updateProgress();
    };

    const promises = prompts.map((_, i) => {
      return new Promise(resolve => {
        setTimeout(() => { generateOne(i).then(resolve); }, i * STAGGER_MS);
      });
    });

    await Promise.all(promises);

    generateBtn.disabled = false;
    validateBtn.disabled = false;
    showActionsBar();
  }

  function showProgress() {
    progressBar.classList.add('visible');
    updateProgress();
  }

  function updateProgress() {
    const done = results.filter(r => r.status === 'done' || r.status === 'error').length;
    const total = results.length;
    progressText.textContent = 'Generating ' + done + ' / ' + total;
    progressFill.style.width = ((done / total) * 100) + '%';
  }

  function showActionsBar() {
    const doneCount = results.filter(r => r.status === 'done').length;
    if (doneCount > 0) {
      floatingBar.classList.add('visible');
      imageCount.textContent = doneCount + ' image' + (doneCount > 1 ? 's' : '');
    }
  }

  // Render gallery
  function renderGallery() {
    emptyState.style.display = 'none';
    gallery.innerHTML = '';
    results.forEach((r, i) => { gallery.appendChild(createCard(r, i)); });
  }

  function createCard(result, index) {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + index;

    const imageDiv = document.createElement('div');
    imageDiv.className = 'card-image' + (selectedRatio === '1:1' ? ' square' : '');

    if (result.status === 'done' && result.image) {
      const img = document.createElement('img');
      img.src = 'data:' + result.mimeType + ';base64,' + result.image;
      img.alt = result.prompt;
      imageDiv.appendChild(img);
      imageDiv.addEventListener('click', () => openLightbox(index));
    } else if (result.status === 'generating') {
      const spinner = document.createElement('div');
      spinner.className = 'spinner';
      imageDiv.appendChild(spinner);
    } else if (result.status === 'error') {
      const errWrap = document.createElement('div');
      errWrap.style.cssText = 'padding:1rem;text-align:center;';
      const errText = document.createElement('span');
      errText.style.cssText = 'color:var(--error);font-size:0.75rem;';
      errText.textContent = result.error || 'Failed';
      errWrap.appendChild(errText);
      imageDiv.appendChild(errWrap);
    } else {
      const pending = document.createElement('span');
      pending.style.cssText = 'color:var(--text-dim);font-size:0.75rem;';
      pending.textContent = 'Pending';
      imageDiv.appendChild(pending);
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    const promptEl = document.createElement('div');
    promptEl.className = 'card-prompt';
    promptEl.textContent = result.prompt;

    const statusEl = document.createElement('div');
    statusEl.className = 'card-status';

    const badge = document.createElement('span');
    badge.className = 'status-badge badge-' + result.status;
    badge.textContent = result.status;
    statusEl.appendChild(badge);

    if (result.status === 'error') {
      const retryBtn = document.createElement('button');
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = 'Retry';
      retryBtn.addEventListener('click', () => retryGeneration(index));
      statusEl.appendChild(retryBtn);
    }

    if (result.status === 'done' && result.verified === false) {
      const warnBadge = document.createElement('span');
      warnBadge.className = 'status-badge badge-unverified';
      warnBadge.textContent = '⚠ review';
      warnBadge.title = (result.problems || []).join('; ') || 'AI verifier flagged a possible mismatch with the prompt';
      statusEl.appendChild(warnBadge);
    }

    body.appendChild(promptEl);
    body.appendChild(statusEl);
    card.appendChild(imageDiv);
    card.appendChild(body);
    return card;
  }

  function updateCard(index) {
    const old = document.getElementById('card-' + index);
    if (old) { old.replaceWith(createCard(results[index], index)); }
  }

  async function retryGeneration(index) {
    results[index].status = 'generating';
    results[index].error = null;
    updateCard(index);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken,
        },
        body: JSON.stringify({ prompt: results[index].prompt, aspectRatio: selectedRatio, imageSize: selectedResolution }),
      });

      if (res.status === 401) { logout(); return; }

      const data = await res.json();
      if (data.error) {
        results[index].status = 'error';
        results[index].error = data.error;
      } else {
        results[index].status = 'done';
        results[index].image = data.image;
        results[index].mimeType = data.mimeType || 'image/png';
        results[index].verified = data.verified;
        results[index].problems = data.problems;
      }
    } catch (e) {
      results[index].status = 'error';
      results[index].error = e.message;
    }

    updateCard(index);
    updateProgress();
    showActionsBar();
  }

  // Lightbox
  function openLightbox(index) {
    currentLightboxIndex = index;
    renderLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderLightbox() {
    const r = results[currentLightboxIndex];
    if (!r || r.status !== 'done') return;
    lightboxImg.src = 'data:' + r.mimeType + ';base64,' + r.image;
    lightboxPrompt.textContent = '';

    // Clear edit state on navigation
    const editInput = document.getElementById('lightboxEditInput');
    const editError = document.getElementById('lightboxEditError');
    if (editInput) editInput.value = '';
    if (editError) editError.textContent = '';

    const doneIndices = results.map((r, i) => r.status === 'done' ? i : -1).filter(i => i >= 0);
    const currentPos = doneIndices.indexOf(currentLightboxIndex);
    lightboxPrev.style.display = currentPos > 0 ? 'block' : 'none';
    lightboxNext.style.display = currentPos < doneIndices.length - 1 ? 'block' : 'none';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
    currentLightboxIndex = -1;
  }

  function navigateLightbox(direction) {
    const doneIndices = results.map((r, i) => r.status === 'done' ? i : -1).filter(i => i >= 0);
    const currentPos = doneIndices.indexOf(currentLightboxIndex);
    const nextPos = currentPos + direction;
    if (nextPos >= 0 && nextPos < doneIndices.length) {
      currentLightboxIndex = doneIndices[nextPos];
      renderLightbox();
    }
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', () => navigateLightbox(-1));
  lightboxNext.addEventListener('click', () => navigateLightbox(1));

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navigateLightbox(-1);
    if (e.key === 'ArrowRight') navigateLightbox(1);
  });

  lightboxDownload.addEventListener('click', () => {
    if (currentLightboxIndex < 0) return;
    const r = results[currentLightboxIndex];
    downloadImage(r.image, r.mimeType, r.prompt, currentLightboxIndex);
  });

  // Lightbox edit
  const lightboxEditInput = document.getElementById('lightboxEditInput');
  const lightboxEditBtn = document.getElementById('lightboxEditBtn');
  const lightboxEditError = document.getElementById('lightboxEditError');

  lightboxEditBtn.addEventListener('click', handleLightboxEdit);
  lightboxEditInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleLightboxEdit();
  });

  async function handleLightboxEdit() {
    const editPrompt = lightboxEditInput.value.trim();
    if (!editPrompt) {
      lightboxEditError.textContent = 'Please enter an edit instruction';
      return;
    }
    if (currentLightboxIndex < 0) return;

    const r = results[currentLightboxIndex];
    if (!r || r.status !== 'done') return;

    lightboxEditInput.disabled = true;
    lightboxEditBtn.disabled = true;
    lightboxEditBtn.textContent = 'Editing...';
    lightboxEditError.textContent = '';

    try {
      const res = await fetch('/api/edit-image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken,
        },
        body: JSON.stringify({
          image: r.image,
          mimeType: r.mimeType,
          prompt: editPrompt,
          originalPrompt: r.prompt,
          aspectRatio: selectedRatio,
          imageSize: selectedResolution,
        }),
      });

      if (res.status === 401) { logout(); return; }

      const data = await res.json();
      if (data.error) {
        lightboxEditError.textContent = data.error;
      } else {
        results[currentLightboxIndex].image = data.image;
        results[currentLightboxIndex].mimeType = data.mimeType || 'image/png';
        results[currentLightboxIndex].verified = data.verified;
        results[currentLightboxIndex].problems = data.problems;
        updateCard(currentLightboxIndex);
        renderLightbox();
        lightboxEditInput.value = '';
      }
    } catch (e) {
      lightboxEditError.textContent = 'Edit failed: ' + e.message;
    }

    lightboxEditInput.disabled = false;
    lightboxEditBtn.disabled = false;
    lightboxEditBtn.textContent = 'Submit';
  }

  // Download helpers
  function downloadImage(base64, mimeType, prompt, index) {
    const ext = mimeType.includes('png') ? 'png' : 'jpg';
    const filename = 'swarajyapix-' + (index + 1) + '-' + slugify(prompt) + '.' + ext;
    const link = document.createElement('a');
    link.href = 'data:' + mimeType + ';base64,' + base64;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40).replace(/-$/, '');
  }

  // Bulk download
  downloadAllBtn.addEventListener('click', async () => {
    const doneResults = results.filter(r => r.status === 'done');
    if (doneResults.length === 0) return;

    downloadAllBtn.disabled = true;
    downloadAllBtn.textContent = 'Creating ZIP...';

    try {
      const zip = new JSZip();
      doneResults.forEach((r, i) => {
        const ext = r.mimeType.includes('png') ? 'png' : 'jpg';
        const filename = 'swarajyapix-' + (i + 1) + '-' + slugify(r.prompt) + '.' + ext;
        zip.file(filename, r.image, { base64: true });
      });

      const blob = await zip.generateAsync({ type: 'blob' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'swarajyapix-' + new Date().toISOString().slice(0, 10) + '.zip';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('ZIP creation failed: ' + e.message);
    }

    downloadAllBtn.disabled = false;
    downloadAllBtn.textContent = 'Download ZIP';
  });

  // Auto-validate on paste
  jsonInput.addEventListener('paste', () => {
    setTimeout(() => validateBtn.click(), 100);
  });

  // Quick single-image generate
  const quickGenInput = document.getElementById('quickGenInput');
  const quickGenBtn = document.getElementById('quickGenBtn');

  quickGenBtn.addEventListener('click', handleQuickGen);
  quickGenInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleQuickGen();
  });

  async function handleQuickGen() {
    const prompt = quickGenInput.value.trim();
    if (!prompt) return;

    quickGenInput.disabled = true;
    quickGenBtn.disabled = true;
    quickGenBtn.textContent = 'Generating...';

    // Add to results array
    const index = results.length;
    results.push({ prompt, status: 'generating', image: null, mimeType: null, error: null });
    emptyState.style.display = 'none';
    gallery.insertBefore(createCard(results[index], index), gallery.firstChild);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken,
        },
        body: JSON.stringify({ prompt, aspectRatio: selectedRatio, imageSize: selectedResolution }),
      });

      if (res.status === 401) { logout(); return; }
      if (res.status === 429) {
        const data = await res.json();
        results[index].status = 'error';
        results[index].error = data.error || 'Rate limit exceeded';
      } else {
        const data = await res.json();
        if (data.error) {
          results[index].status = 'error';
          results[index].error = data.error;
        } else {
          results[index].status = 'done';
          results[index].image = data.image;
          results[index].mimeType = data.mimeType || 'image/png';
          results[index].verified = data.verified;
          results[index].problems = data.problems;
        }
      }
    } catch (e) {
      results[index].status = 'error';
      results[index].error = e.message;
    }

    updateCard(index);
    showActionsBar();
    quickGenInput.value = '';
    quickGenInput.disabled = false;
    quickGenBtn.disabled = false;
    quickGenBtn.textContent = 'Generate';
  }

  // ===== INIT =====
  checkAuth();
})();
</script>

</body>
